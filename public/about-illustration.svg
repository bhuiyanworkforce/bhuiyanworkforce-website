<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2744"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#abg)"/>

  <!-- Glow circles -->
  <circle cx="620" cy="120" r="200" fill="rgba(201,168,76,0.07)"/>
  <circle cx="140" cy="380" r="170" fill="rgba(30,73,118,0.35)"/>

  <!-- Simplified world map dots -->
  <g fill="#3a5f8a" opacity="0.55">
    <circle cx="90" cy="180" r="4"/><circle cx="110" cy="170" r="4"/><circle cx="130" cy="185" r="4"/>
    <circle cx="100" cy="200" r="4"/><circle cx="150" cy="200" r="4"/><circle cx="170" cy="175" r="4"/>
    <circle cx="260" cy="150" r="4"/><circle cx="280" cy="140" r="4"/><circle cx="300" cy="155" r="4"/>
    <circle cx="270" cy="170" r="4"/><circle cx="320" cy="165" r="4"/>
    <circle cx="420" cy="220" r="4"/><circle cx="440" cy="210" r="4"/><circle cx="460" cy="225" r="4"/>
    <circle cx="430" cy="240" r="4"/><circle cx="480" cy="235" r="4"/><circle cx="500" cy="215" r="4"/>
    <circle cx="580" cy="270" r="4"/><circle cx="600" cy="260" r="4"/><circle cx="620" cy="280" r="4"/>
    <circle cx="590" cy="295" r="4"/><circle cx="640" cy="285" r="4"/>
    <circle cx="680" cy="180" r="4"/><circle cx="700" cy="170" r="4"/><circle cx="710" cy="195" r="4"/>
    <circle cx="200" cy="320" r="4"/><circle cx="220" cy="335" r="4"/><circle cx="180" cy="340" r="4"/>
    <circle cx="380" cy="340" r="4"/><circle cx="400" cy="355" r="4"/><circle cx="360" cy="360" r="4"/>
  </g>

  <!-- Deployment routes, converging from a central hub (Bangladesh) -->
  <g fill="none" stroke="#c9a84c" stroke-width="2">
    <path d="M400 260 C 340 220, 260 180, 130 190" opacity="0.55"/>
    <path d="M400 260 C 440 210, 500 190, 600 270" opacity="0.55"/>
    <path d="M400 260 C 420 300, 460 330, 590 300" opacity="0.55"/>
    <path d="M400 260 C 360 300, 300 320, 210 330" opacity="0.55"/>
    <path d="M400 260 C 480 230, 560 200, 690 190" opacity="0.4"/>
  </g>

  <!-- Route dots -->
  <g fill="#e8c96f">
    <circle cx="130" cy="190" r="6"/>
    <circle cx="600" cy="270" r="6"/>
    <circle cx="590" cy="300" r="6"/>
    <circle cx="210" cy="330" r="6"/>
    <circle cx="690" cy="190" r="6"/>
  </g>

  <!-- Central hub -->
  <circle cx="400" cy="260" r="14" fill="#0f2744" stroke="#e8c96f" stroke-width="4"/>
  <circle cx="400" cy="260" r="26" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.5"/>
  <circle cx="400" cy="260" r="38" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>

  <!-- Label chip -->
  <g transform="translate(320,320)">
    <rect x="0" y="0" width="160" height="34" rx="17" fill="rgba(15,39,68,0.85)" stroke="rgba(201,168,76,0.4)"/>
    <circle cx="20" cy="17" r="5" fill="#e8c96f"/>
    <text x="34" y="22" font-family="Arial, sans-serif" font-size="13" fill="#f0e6c8">Bangladesh Hub</text>
  </g>
</svg>
